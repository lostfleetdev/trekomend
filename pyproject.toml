[project]
name = "recommend"
version = "0.1.0"
description = "TMDB movie embeddings with Qwen3-0.6B on Colab T4. Visualize, validate, and search similar movies locally."
requires-python = ">=3.12"
dependencies = [
    "h5py>=3.12",
    "matplotlib>=3.10",
    "numpy>=2.4",
    "pandas>=3.0",
    "scikit-learn>=1.8",
    "tqdm>=4.67",
]

[project.optional-dependencies]
colab = [
    "torch>=2.5",
    "transformers>=4.49",
    "accelerate>=1.3",
    "sentencepiece>=0.2",
    "safetensors>=0.5",
    "tokenizers>=0.21",
]
